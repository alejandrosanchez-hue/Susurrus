<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Susurrus</title>
<link rel="preload" href="fonts/IvarDisplay-Regular.otf" as="font" type="font/otf" crossorigin>
<link rel="preload" href="fonts/IvarDisplay-Medium.otf" as="font" type="font/otf" crossorigin>
<style>
@font-face{font-family:"Ivar Display";src:url(fonts/IvarDisplay-Regular.otf) format("opentype");font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:"Ivar Display";src:url(fonts/IvarDisplay-Medium.otf) format("opentype");font-weight:500;font-style:normal;font-display:swap}
/* Layout: one paper ground, 1920px Figma grid scaled fluidly; centered editorial heads over edge-to-edge imagery with a 32px gutter. */
:root{
  --paper:#F6F1E4;       /* frame fill */
  --paper-fade:#EAE4D4;  /* textured band average */
  --ink:#000;
  --ink-mute:rgba(0,0,0,.3);
  --ink-faint:rgba(0,0,0,.22);
  --emboss:#CECCC7;
  --night:#101010;
  --night-ink:#fff;
  --night-mute:rgba(255,255,255,.4);
  --font:"Ivar Display","Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --g:clamp(16px,1.667vw,32px);
  --gap:clamp(8px,1.667vw,32px);
  --sec:clamp(96px,8.33vw,160px);
  --sec-lg:clamp(120px,12.5vw,240px);
  --head:clamp(32px,3.33vw,64px);
  --t-xs:clamp(11px,.833vw,16px);
  --t-md:clamp(17px,1.25vw,24px);
  --t-lg:clamp(26px,2.083vw,40px);
  --nav-h:72px;
  color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-behavior:auto}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-optical-sizing:auto;-webkit-font-smoothing:antialiased;overflow-x:hidden}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;text-transform:inherit;letter-spacing:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:1px solid currentColor;outline-offset:4px}
.caps{text-transform:uppercase;letter-spacing:.02em}
/* Figma: paper image at 40% multiply over the cream fill, used only on specific bands */
.tex{background:var(--paper-fade) url(img/tex.jpg) repeat;background-size:1280px auto}

/* ---------- nav ---------- */
.nav{position:fixed;inset:0 0 auto 0;z-index:50;display:flex;justify-content:space-between;align-items:center;padding:calc(24px + env(safe-area-inset-top,0px)) var(--g) 24px;color:var(--ink);pointer-events:none}
/* header colour follows what is underneath: white over photographs, black over plain paper */
.nav .logo,.nav .menu,.nav .mbar{transition:color .45s ease}
.nav .on-img{color:#fff}
.nav>*{pointer-events:auto}
.logo{display:block;width:clamp(120px,8.86vw,170px);height:auto}
.logo svg{display:block;width:100%;height:auto;fill:currentColor}
.menu{display:flex;gap:clamp(16px,1.667vw,32px);font-size:var(--t-xs);line-height:1;letter-spacing:.02em}
.menu a,.menu button{text-transform:uppercase}
.menu .sw span{transition:opacity .3s}
.menu .sw[aria-pressed="false"] .on,.menu .sw[aria-pressed="true"] .off{opacity:.3}

.mbar{display:none;align-items:center;gap:24px}
.sw-ico{display:block;width:18px;height:20px}
.sw-ico svg{display:block;width:100%;height:100%;fill:currentColor}
.sw-ico rect{transform-origin:center;transform-box:fill-box}
.sw-ico[aria-pressed="true"] rect{animation:wave 1.1s ease-in-out infinite alternate}
.sw-ico[aria-pressed="true"] rect:nth-child(2n){animation-delay:-.55s}
.sw-ico[aria-pressed="true"] rect:nth-child(3){animation-delay:-.3s}
@keyframes wave{from{transform:scaleY(1)}to{transform:scaleY(.35)}}
.menu-btn{font-size:16px;line-height:1}
.mnav{position:fixed;inset:0;z-index:60;background:var(--paper-fade) url(img/tex.jpg) repeat;background-size:1280px auto;display:grid;place-items:center;padding:16px}
.mnav[hidden]{display:none}
.mnav nav{display:grid;gap:20px;justify-items:center}
.mnav nav a{font-weight:500;font-size:24px;line-height:1;letter-spacing:.02em;text-transform:uppercase}
.mnav-close{position:absolute;top:calc(16px + env(safe-area-inset-top,0px));right:16px;font-size:16px;line-height:1}
.lbl .mo{display:none}

/* ---------- view transitions ---------- */
#view{min-height:100svh}
/* images fade in softly once loaded and in view */
#view img{opacity:0;transition:opacity 1.2s cubic-bezier(.25,.1,.25,1)}
#view img.in,#view.instant img{opacity:1}
#view.instant img{transition:none}
/* Home → Stories: the paper texture rises behind the page as the stories tail scrolls in */
.texveil{position:fixed;inset:0;z-index:-1;pointer-events:none;background:var(--paper-fade) url(img/tex.jpg) repeat;background-size:1280px auto;opacity:0}
.tail .filters{opacity:clamp(0,calc(var(--p,1) * 2.4 - .5),1)}
.tail .cell{--a:clamp(0,calc(var(--p,1) * 2.2 - var(--r) * .18 - .1),1);opacity:var(--a);transform:translateY(calc((1 - var(--a)) * 56px));transition:none}
.tail .tail-hint{opacity:clamp(0,calc(var(--p,1) * 3 - 2),1)}
#plp.enter .filters{animation:rise .9s cubic-bezier(.2,.6,.2,1) backwards}
#plp.enter .cell{animation:rise 1s cubic-bezier(.2,.6,.2,1) backwards;animation-delay:calc(var(--r) * 70ms + 80ms)}
@keyframes rise{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:none}}
::view-transition-old(root),::view-transition-new(root){animation-duration:.7s;animation-timing-function:cubic-bezier(.4,0,.2,1)}
::view-transition-group(story-img){animation-duration:.8s;animation-timing-function:cubic-bezier(.6,0,.2,1)}
.fade-in{animation:fadeIn .9s cubic-bezier(.2,.6,.2,1) both}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

/* ---------- shared blocks ---------- */
.sh{display:grid;justify-items:center;gap:24px;text-align:center;padding-inline:var(--g)}
.sh .tt{display:grid;justify-items:center;gap:8px}
.eyebrow{margin:0;font-size:var(--t-xs);line-height:1;letter-spacing:.02em;text-transform:uppercase}
.sh h2{margin:0;font-weight:500;font-size:var(--t-lg);line-height:1.1;letter-spacing:.02em;text-transform:uppercase;max-width:14em;text-wrap:balance}
.lead{margin:0;font-size:var(--t-md);line-height:1.1;letter-spacing:.02em;max-width:36em;text-wrap:balance}
.sec{display:grid;gap:var(--head)}
.media{padding-inline:var(--g)}
.ph{border-radius:4px;overflow:hidden;background:var(--paper-fade)}
.ph img{width:100%;height:100%;object-fit:cover}
.full .ph{aspect-ratio:1856/1080}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:var(--gap);padding-inline:var(--g)}
.pair .ph{aspect-ratio:912/1080}
.caps2{display:grid;grid-template-columns:1fr 1fr;gap:var(--gap);padding-inline:var(--g);margin-top:calc(var(--gap) - var(--head))}
.caps2 p,.cols2 p{margin:0 auto;max-width:800px;font-size:var(--t-md);line-height:1.1;letter-spacing:.02em;text-align:center;text-wrap:pretty}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:var(--gap);padding-inline:var(--g)}
.cols2 div{display:grid;gap:8px;align-content:start}
.cols2 h3{margin:0 auto;max-width:800px;font-weight:400;font-size:var(--t-md);line-height:1.1;letter-spacing:.02em;text-transform:uppercase;text-align:center}
.stack{display:grid;gap:var(--gap)}
.statement{margin:0 auto;max-width:1386px;padding-inline:var(--g);font-size:var(--t-lg);line-height:1.1;letter-spacing:.02em;text-align:center;text-wrap:balance}
.sk-wrap{position:relative}
.sk{position:absolute;z-index:2;pointer-events:none;will-change:transform}

/* ---------- home ---------- */
.hero{position:relative;height:clamp(460px,56.25vw,100svh);overflow:hidden}
.hero img{width:100%;height:100%;object-fit:cover;animation:settle 2.6s cubic-bezier(.2,.6,.2,1) both}
/* ---------- intro: the bar appears, then the wordmark unfolds from it ---------- */
.intro{position:fixed;inset:0;z-index:100;display:grid;place-items:center;cursor:default}
.intro-bg{position:absolute;inset:0;background:var(--paper)}
.intro-logo{position:relative;width:min(240px,46vw);color:var(--ink)}
.intro-logo svg{display:block;width:100%;height:auto;fill:currentColor;overflow:visible}
.intro-logo path{transform-box:fill-box}
html.intro-on{overflow:hidden}
html.intro-on .nav{opacity:0}
html.intro-on .hero img{animation-play-state:paused}
.nav{transition:opacity 1s cubic-bezier(.4,0,.2,1),transform .7s cubic-bezier(.4,0,.2,1)}
.nav.away{transform:translateY(-100%);opacity:0;transition:opacity .5s ease,transform .7s cubic-bezier(.4,0,.2,1)}
.nav .logo path{transform-box:fill-box}
@keyframes settle{from{transform:scale(1.06)}to{transform:none}}
.home-body{display:grid;gap:var(--sec);padding-block:var(--sec) 0}
.sketch-stage{display:flex;justify-content:center;padding-inline:var(--g)}
.sketch-stage img{width:min(1484px,100%)}
.cap1{margin:0 auto;max-width:800px;padding-inline:var(--g);font-size:var(--t-md);line-height:1.1;letter-spacing:.02em;text-align:center;margin-top:calc(var(--gap) - var(--head))}

/* ---------- stories grid (PLP + home tail) ---------- */
.plp{padding-top:calc(var(--nav-h) + 4px + env(safe-area-inset-top,0px))}
.filters,.grid{display:grid;grid-template-columns:repeat(5,1fr);column-gap:6px;padding-inline:var(--g)}
.filters{align-items:start;font-size:var(--t-xs);line-height:1;letter-spacing:.02em;text-transform:uppercase;min-height:16px}
.filters .f{justify-self:start;color:var(--ink-faint);transition:color .3s}
.filters .f.on{color:var(--ink)}
.filters .f:not(.on):hover{color:var(--ink-mute)}
.locs{display:grid;gap:6px;margin-top:0;max-height:0;overflow:hidden;transition:max-height .5s cubic-bezier(.4,0,.2,1),margin .5s}
.filters .col.open .locs{max-height:200px;margin-top:24px}
.locs button{justify-self:start;text-transform:uppercase;color:var(--ink-mute);transition:color .25s}
.locs button:hover,.locs button.hl,.locs button.picked{color:var(--ink)}
.locs button.picked::before{content:'';display:inline-block;width:.45em;height:.45em;border-radius:50%;background:currentColor;margin-right:.5em;vertical-align:.1em}
.filters .col.open .locs{max-height:240px}
.grid{row-gap:40px;margin-top:104px;position:relative}
.cell{display:grid;gap:16px;grid-template-rows:16px auto;grid-row:var(--r);grid-column:var(--c);transition:opacity .45s}
.cell .lbl{font-size:var(--t-xs);line-height:1;letter-spacing:.02em;text-transform:uppercase;white-space:nowrap}
.cell button{display:block;width:100%;aspect-ratio:367/215;overflow:hidden;border-radius:2px}
.cell img{width:100%;height:100%;object-fit:cover;transition:transform 1.2s cubic-bezier(.2,.6,.2,1)}
.cell button:hover img{transform:scale(1.04)}
.grid.dim .cell:not(.hl){opacity:.3}
.grid-fade{position:absolute;left:0;right:0;bottom:0;height:144px;pointer-events:none;background:linear-gradient(to bottom,rgba(234,228,212,0),var(--paper-fade) 74.5%)}
.plp.screen{height:100svh;display:flex;flex-direction:column;overflow:hidden;position:relative}
.loop{--ft:clamp(48px,4.17vw,80px);--fb:32%;position:relative;flex:1;min-height:0;overflow:hidden;margin-top:24px;
  
}
.track{display:flex;flex-direction:column;gap:40px;will-change:transform}
.loop .grid{margin-top:0}
#plp .loop{cursor:ns-resize;touch-action:none}
#plp .loop .cell button{cursor:pointer}
.tail{margin-top:var(--sec)}
.tail-hint{position:absolute;left:0;right:0;bottom:28px;z-index:3;text-align:center;font-size:var(--t-xs);letter-spacing:.02em;text-transform:uppercase;color:var(--ink-mute)}
.plp .grid-outro{height:clamp(80px,7vw,136px)}
.plp+.foot{margin-top:0}

/* ---------- footer ---------- */
.foot{background:var(--night) url(img/night.jpg) repeat;background-size:1280px auto;color:var(--night-ink);display:grid;gap:clamp(96px,8.33vw,160px);justify-items:center;padding:32px var(--g) calc(64px + env(safe-area-inset-bottom,0px));margin-top:var(--sec)}
.foot .cats{display:grid;grid-template-columns:repeat(4,minmax(0,418px));gap:40px;width:100%}
.foot .tag{margin:0;font-size:var(--t-md);line-height:1.1}
.foot h4{margin:0;padding-block:8px;border-bottom:1px solid var(--night-ink);font-weight:400;font-size:var(--t-md);line-height:1}
.foot ul{list-style:none;margin:24px 0 0;padding:0;display:grid;gap:8px;font-size:clamp(13px,.833vw,16px);line-height:1}
.foot li span{display:inline-block;width:2.2em}
.foot .mute{color:var(--night-mute)}
.foot .big{width:min(340px,70vw)}
.foot .big svg{width:100%;height:auto;fill:currentColor;display:block}

/* ---------- story (PDP) ---------- */
.shero{position:relative;height:100svh;min-height:520px;display:grid;grid-template-rows:1fr auto 1fr;justify-items:center;align-items:center;padding-top:env(safe-area-inset-top,0px)}
.emb{margin:0;font-weight:500;font-size:var(--t-lg);line-height:1;letter-spacing:.02em;text-transform:uppercase;color:var(--emboss);text-shadow:0 1px 0 rgba(255,255,255,.75),0 -1px 0 rgba(0,0,0,.05);text-align:center;padding-inline:var(--g)}
.shero .emb.top{align-self:end;padding-bottom:clamp(16px,3vh,40px)}
.shero .emb.bot{align-self:start;padding-top:clamp(16px,3vh,40px)}
.orn{--w:min(1045px,84vw,calc((100svh - 240px) * 1.3714));position:relative;width:var(--w);aspect-ratio:1045/762}
.orn>img{position:absolute;inset:0;width:100%;height:100%;mix-blend-mode:multiply}
.orn .win{position:absolute;left:50%;top:50%;width:56.2%;aspect-ratio:587/425;transform:translate(-50%,-50%);overflow:hidden;box-shadow:0 0 0 2px #dbd8cd;mix-blend-mode:multiply}
.orn .win img{width:100%;height:100%;object-fit:cover}
.snav .side{position:fixed;z-index:49;color:#fff;mix-blend-mode:difference}
.side{position:absolute;top:50%;transform:translateY(-50%);font-size:var(--t-xs);line-height:1.1;letter-spacing:.02em;text-transform:uppercase;display:grid}
.side.prev{left:var(--g)}
.side.next{right:var(--g);text-align:right}
.side:hover{opacity:.55}
.pdp-body{--head:clamp(40px,4.17vw,80px);display:grid;gap:var(--sec-lg);padding-top:var(--sec)}
.pdp-body .sh{gap:clamp(16px,1.667vw,32px)}
.stack .caps2,.stack .cols2{margin-top:0}
.loose{display:grid;gap:var(--sec)}
.quote{display:grid;gap:32px;justify-items:center;padding-inline:var(--g)}
.quote p:not(.eyebrow){margin:0;max-width:1386px;font-size:var(--t-lg);line-height:1.1;letter-spacing:.02em;text-align:center}
.quote .w{transition:color .35s}
.quote .w.dim{color:var(--ink-mute)}
.dd{display:grid;justify-items:center;gap:clamp(64px,6.25vw,120px);padding:var(--sec) var(--g)}
.dd .sh h2{max-width:none}
.ddf{position:relative;width:min(796px,100%);aspect-ratio:800/629}
.ddf img{position:absolute;mix-blend-mode:multiply}
.ddf img:first-child{inset:0;width:100%;height:100%}
.ddf .ddp{left:16.74%;top:19.32%;width:66.6%;height:auto}
.ph.mul{background:none;mix-blend-mode:multiply}
.prelude{display:grid;justify-items:center;gap:18px;padding-inline:var(--g)}
.prelude .bar{width:min(260px,50vw);height:1px;background:var(--ink-faint);position:relative;overflow:hidden}
.prelude .bar i{position:absolute;inset:0;background:var(--ink);transform-origin:left;transform:scaleX(0)}
.moods{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--gap);padding-inline:var(--g);max-width:1440px;margin:0 auto;width:100%}
.moods .ph{aspect-ratio:367/215}
.note{margin:0 auto;max-width:36em;padding-inline:var(--g);text-align:center;font-size:var(--t-md);line-height:1.2;color:var(--ink-mute)}

/* ---------- studio ---------- */
.studio-page{display:grid;gap:var(--sec);padding-top:calc(var(--nav-h) + clamp(64px,8.33vw,160px) + env(safe-area-inset-top,0px))}
.studio-intro h1{font-weight:400}
.studio-intro{display:grid;justify-items:center;gap:8px;text-align:center;padding-inline:var(--g)}
.studio-intro .lead-lg{margin:0;max-width:956px;font-size:var(--t-lg);line-height:1.1;letter-spacing:.02em;text-wrap:balance}
.fig{display:grid;gap:16px;margin:0}
.fig figcaption{font-size:var(--t-xs);line-height:1;letter-spacing:.02em;text-transform:uppercase;text-align:center}
.studio-page .full .ph{aspect-ratio:1856/1080}
.pair-fig{display:grid;grid-template-columns:1fr 1fr;gap:var(--gap);padding-inline:var(--g)}
.pair-fig .ph{aspect-ratio:912/1080}
.bio{margin:0 auto;max-width:1386px;padding-inline:var(--g);display:grid;gap:1.1em;font-size:var(--t-lg);line-height:1.1;letter-spacing:.02em;text-align:center;text-wrap:pretty}
.bio p{margin:0}
.bio.wide{gap:2.2em}
.team{margin-top:calc(var(--sec-lg) - clamp(48px,4.17vw,80px));padding-top:clamp(48px,4.17vw,80px);display:grid;gap:var(--sec)}
.team .sh h2{max-width:956px}
.team-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));column-gap:6px;row-gap:40px;padding-inline:var(--g)}
.member{display:grid;gap:16px;margin:0}
.member .ph{aspect-ratio:367/460;border-radius:0}
.member figcaption{display:grid;gap:6px;font-size:var(--t-xs);line-height:1;letter-spacing:.02em}
.member .nm{text-transform:uppercase}
.member .rl{color:rgba(0,0,0,.4)}
.studio-page+.foot,.team+.foot{margin-top:0}
.team .foot{margin-top:0}


/* ---------- v2 layout (Figma "Web", Oct 2026) ---------- */
.nav .sw,.mbar .sw-ico{display:none!important}
.home-body{gap:var(--sec-lg);padding-block:var(--sec-lg) 0}
.bleed .ph{border-radius:0;aspect-ratio:16/9}
.duo{display:grid;grid-template-columns:repeat(var(--n,2),minmax(0,1fr));gap:clamp(8px,2.083vw,40px);padding-inline:clamp(16px,6.25vw,120px)}
.media .duo{padding-inline:clamp(0px,4.6vw,88px)}
.duo figure{margin:0;display:grid;gap:20px;align-content:start}
.duo .ph{aspect-ratio:var(--ar,820/1080)}
.duo figcaption{font-size:var(--t-md);line-height:1.1;letter-spacing:.02em;text-align:center;text-wrap:pretty}
.ttl-img{display:grid;gap:clamp(32px,3.125vw,60px)}
.marco{display:grid;justify-items:center;gap:clamp(32px,3.125vw,60px);padding:clamp(40px,3.125vw,60px) var(--g)}
.marco .frame{width:min(1059px,100%);height:auto;aspect-ratio:1059/722}
.marco .cap{margin:0;max-width:800px;font-size:var(--t-md);line-height:1.1;letter-spacing:.02em;text-align:center;text-wrap:balance}
.marco .cap.md{font-weight:500}
.marco .cap.lg{max-width:1100px;font-size:var(--t-lg)}
.reveal{display:grid;justify-items:center;gap:32px;padding-inline:var(--g)}
.reveal .txt{margin:0;max-width:902px;font-size:var(--t-lg);line-height:1.1;letter-spacing:.02em;text-align:center}
.reveal .w{transition:color .35s}
.reveal .w.dim{color:var(--ink-mute)}
.loose-t{margin:0 auto;max-width:1673px;padding-inline:var(--g);font-size:var(--t-lg);line-height:1.1;letter-spacing:.02em;text-align:center;text-wrap:balance}
.pdp2{display:grid;gap:var(--sec-lg);padding-top:var(--sec-lg)}
.blk{display:grid;gap:clamp(48px,6.25vw,120px)}
.blk.tight{gap:0}
.split{display:grid;grid-template-columns:1fr 1fr;background-color:#e9e5d9}
.split .ph{border-radius:0;aspect-ratio:960/1080}
.split .sc{display:grid;place-items:center;padding:var(--g)}
.split .inner{width:min(629px,100%);display:grid;gap:20px;text-align:center}
.split .inner img{width:100%;height:auto;aspect-ratio:629/438}
.split h3{margin:0;font-weight:500;font-size:var(--t-md);line-height:1.1;letter-spacing:.02em;text-transform:uppercase}
.split p{margin:0;font-size:var(--t-md);line-height:1.1;letter-spacing:.02em}
.board{background:#c4c4b6;display:grid;gap:0;padding-top:clamp(40px,3vw,58px)}
.board img{display:block;width:100%;height:auto;aspect-ratio:1920/1052;-webkit-mask-image:linear-gradient(to bottom,transparent,#000 9%);mask-image:linear-gradient(to bottom,transparent,#000 9%)}
.nextp{display:grid;gap:clamp(32px,3.125vw,60px);cursor:pointer}
.nextp .ph{aspect-ratio:1856/1080}
.nextp .ph img{opacity:.3;transition:opacity 1.2s ease}
.nextp:hover .ph img{opacity:.45}
.dhero{display:grid;gap:clamp(40px,4vw,80px);padding-top:calc(var(--nav-h) + clamp(64px,8.33vw,160px))}
.locrow{display:flex;flex-wrap:wrap;column-gap:clamp(24px,6.25vw,120px);row-gap:10px;padding:0 var(--g);font-size:var(--t-xs);line-height:1;letter-spacing:.02em;text-transform:uppercase;min-height:16px}
.locrow button{opacity:.3;text-transform:uppercase;transition:opacity .35s}
.locrow button:hover,.locrow button.hl,.locrow button.on{opacity:1}
.plp .cell button{transition:opacity .45s}
@media (hover:hover){.plp .cell button{opacity:.45}.plp .cell .lbl{opacity:.45;transition:opacity .45s}.plp .cell.hl button,.plp .cell.hl .lbl{opacity:1}}
.grid.dim .cell:not(.hl){opacity:1}
.plp .grid.picked .cell:not(.hl) button,.plp .grid.picked .cell:not(.hl) .lbl{opacity:.35}
.plp .grid.picked .cell.hl button,.plp .grid.picked .cell.hl .lbl{opacity:1}

.foot .tag{margin:0;font-size:clamp(16px,1.04vw,20px);line-height:1.1;text-align:center}

  .reveal .txt,.loose-t,.marco .cap.lg{font-size:16px}
  .locrow{column-gap:16px}
}

/* ---------- titles: letters slide out of a clipping mask, centre first, like the wordmark ---------- */
.tw{display:inline-block;white-space:nowrap}
.tl{display:inline-block;overflow:hidden;vertical-align:top;padding-block:.12em;margin-block:-.12em}
.tl>i{display:inline-block;font-style:normal;transform:translateX(var(--from));transition:transform 1.6s cubic-bezier(.6,0,.2,1) var(--d)}
.t-in .tl>i{transform:none}

/* ---------- text: lines rise out of a clipping mask ---------- */
.ln{display:block;overflow:hidden;padding-bottom:.14em;margin-bottom:-.14em}
.li{display:block;transform:translateY(110%)}
.lines-in .li{transform:none;transition:transform 1.3s cubic-bezier(.6,0,.2,1) var(--d)}
/* ---------- images: a mask opens from the bottom while the photo settles ---------- */
.rv{opacity:0;transform:translateY(32px)}
.rv.rv-in{opacity:1;transform:none;transition:opacity 1.6s cubic-bezier(.25,.1,.25,1),transform 2.2s cubic-bezier(.2,.6,.2,1)}
#view .rv img{opacity:1;transition:none}
.rv:not(.hero)>img{transform:scale(1.05)}
.rv.rv-in:not(.hero)>img{transform:none;transition:transform 2.8s cubic-bezier(.2,.6,.2,1)}
.hero.rv{transform:none}

/* ---------- smooth scroll (Lenis) ---------- */
html.lenis,html.lenis body{height:auto}
.lenis.lenis-smooth{scroll-behavior:auto!important}
.lenis.lenis-stopped{overflow:hidden}

/* ---------- story intro: the story name unfolds from a bar on paper, then dissolves into the page ---------- */
.sintro{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:var(--paper);cursor:default}

.sintro .tl>i{transition-duration:1s}
.sintro .sbar{display:block;width:max(1.5px,.045em);height:1em;background:currentColor;transform:scaleY(0);transition:transform .8s cubic-bezier(.33,0,.15,1) .2s}
.sintro.t-in .sbar{transform:none}

<script>
(() => {
const reduce = matchMedia('(prefers-reduced-motion: reduce)');
/* smooth scroll for the whole site; paused while an intro or the mobile menu covers the page */
let lenis = null;
if (window.Lenis && !reduce.matches) {
  lenis = new Lenis({lerp:.08, smoothWheel:true, wheelMultiplier:.9});
  const raf = t => {
    const busy = document.documentElement.classList.contains('intro-on') || document.documentElement.style.overflow === 'hidden';
    if (busy && !lenis.isStopped) lenis.stop(); else if (!busy && lenis.isStopped) lenis.start();
    lenis.raf(t); requestAnimationFrame(raf);
  };
  requestAnimationFrame(raf);
}
const toTop = () => { window.scrollTo(0, 0); if (lenis) lenis.scrollTo(0, {immediate:true, force:true}); };
const LOGO = document.querySelector('.logo svg').outerHTML;
const I = n => `img/${n}`;

/* Stories and their thumbnails, placed on the 5-column PLP grid exactly as in the Figma frame (row, column). */
const STORIES = [
  {id:'naples',        n:'01', name:'Naples',        title:'The Mediterranean Villa', hero:I('p_villa.webp'), cells:['00','01'], m:[[0,0],[0,1]]},
  {id:'palm-beach',    n:'02', name:'Palm Beach',    cells:['03','04','10'], m:[[0,3],[1,1],[1,0]]},
  {id:'new-york-city', n:'03', name:'New York City', cells:['12','13','14'], m:[[1,2],[1,3],[2,2]]},
  {id:'kyoto',         n:'04', name:'Kyoto',         cells:['20','21','22'], m:[[2,0],[2,1],[3,0]]},
  {id:'ibiza',         n:'05', name:'Ibiza',         cells:['24','30','31'], m:[[2,3],[3,1],[3,2]]},
  {id:'miami',         n:'06', name:'Miami',         cells:['33','34','40'], m:[[3,3],[4,0],[4,1]]},
  {id:'galapagos',     n:'07', name:'Galapagos',     cells:['42','43','44'], m:[[4,2],[4,3],[5,2]]},
];
const byId = Object.fromEntries(STORIES.map(s => [s.id, s]));
const heroOf = s => s.hero || I(`g${s.cells[0]}.jpg`);
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;');

/* ---------- templates ---------- */

function groupsFor(){
  return STORIES.map(s => ({id:s.id, name:s.name, label:s.id === 'naples' ? 'Coastal Lifestyle' : `<span class="d">Story ${s.n}</span><span class="mo">S.${s.n}</span> – ${s.name}`, cells:s.cells}));
}
/* Where each image sits for the current lens. Locations without a pick = the Figma placement;
   otherwise groups flow left to right (5 columns desktop, 4 on phone) with one empty cell between groups, picked group first. */
function positions(){
  let groups = groupsFor(FS.lens);
  const figma = true, out = {};
  let slot = 0;
  groups.forEach(g => {
    g.cells.forEach((rc, k) => {
      let r, c, mr, mc;
      if (figma) { r = +rc[0]; c = +rc[1]; [mr, mc] = byId[g.id].m[k]; }
      else { r = Math.floor(slot / 5); c = slot % 5; mr = Math.floor(slot / 4); mc = slot % 4; }
      slot++;
      out[rc] = {r:r + 1, c:c + 1, mr:mr + 1, mc:mc + 1, g:g.id, label:k === 0 ? g.label : '', order:slot};
    });
    slot++;
  });
  return out;
}
const gridHTML = () => { const P = positions(); return ALL.map(rc => { const s = storyOf(rc), p = P[rc]; return `
    <div class="cell" data-rc="${rc}" data-story="${s.id}" data-g="${p.g}" style="--r:${p.r};--c:${p.c};--mr:${p.mr};--mc:${p.mc}">
      <span class="lbl">${p.label}</span>
      <button type="button" data-open="${s.id}" aria-label="Open story ${s.n}, ${s.name}"><img src="${I(`g${rc}.jpg`)}" alt="" decoding="async"></button>

/* Filter change: the grid exhales (soft fade out), is re-laid out while invisible, then breathes back in with a gentle rise. No cells fly across the page. */
function applyLayout(P){
  view.querySelectorAll('.grid .cell').forEach(el => {
    const p = P[el.dataset.rc];
    el.dataset.g = p.g;
    el.style.setProperty('--r', p.r); el.style.setProperty('--c', p.c);
    el.style.setProperty('--mr', p.mr); el.style.setProperty('--mc', p.mc);
    el.querySelector('.lbl').innerHTML = p.label;
  });
  highlight(null);
  view.querySelectorAll('.loop').forEach(l => l._home && l._home());
}
function syncFilters(){
  view.querySelectorAll('[data-pick]').forEach(b => { const on = b.dataset.pick === FS.pick; b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); });
}
/* Filter change: every image glides from where it was to its new place. Slow ease-in-out, and the cells set off one after another in reading order of their new position, so the grid rearranges calmly. */
function layoutGrid(animate){
  const cells = [...view.querySelectorAll('.grid .cell')];
  if (!cells.length) return;
  const P = positions();
  syncFilters();
  if (!animate || reduce.matches || !cells[0].animate) { applyLayout(P); return; }
  cells.forEach(c => { c.getAnimations().forEach(x => x.cancel()); c.querySelector('.lbl').getAnimations().forEach(x => x.cancel()); });
  const before = new Map(cells.map(c => [c, c.getBoundingClientRect()]));
  applyLayout(P);
  const seq = p => (p.r - 1) * 5 + (p.c - 1);   // reading order of the new position
  cells.forEach(c => {
    const p = P[c.dataset.rc], a = before.get(c), b = c.getBoundingClientRect();
    const dx = a.left - b.left, dy = a.top - b.top;
    const delay = Math.min(seq(p), 24) * 45;
    if (Math.abs(dx) > .5 || Math.abs(dy) > .5)
      c.animate([{transform:`translate(${dx}px,${dy}px)`}, {transform:'translate(0,0)'}],
                {duration:1400, delay, easing:'cubic-bezier(.45,0,.25,1)', fill:'backwards'});
    const lbl = c.querySelector('.lbl');
    if (lbl.textContent) lbl.animate([{opacity:0}, {opacity:1}], {duration:600, delay:delay + 1000, easing:'ease-out', fill:'backwards'});
  });
}
function highlight(id){
  const g = id || FS.pick;
  view.querySelectorAll('.grid').forEach(gr => { gr.classList.toggle('dim', !!g); gr.classList.toggle('picked', !!FS.pick); });
  view.querySelectorAll('.grid .cell').forEach(c => c.classList.toggle('hl', c.dataset.g === g));
  view.querySelectorAll('[data-pick]').forEach(b => b.classList.toggle('hl', !!g && b.dataset.pick === g));
}

/* ---------- router ---------- */
const view = document.getElementById('view');
let current = null, lock = false, lastY = 0;

function routeFrom(hash){
  const h = (hash || '').replace('#','');
  if (h === 'stories' || h === 'studio') return h;
  if (byId[h]) return h;
  return 'home';
}

function render(route){
  current = route;
  view.classList.toggle('instant', route === 'stories' && !entering);
  if (route === 'home') view.innerHTML = homeView();
  else if (route === 'stories') { view.innerHTML = plpView(); if (entering) view.querySelector('#plp').classList.add('enter'); }
  else if (route === 'studio') view.innerHTML = studioView();
  else view.innerHTML = storyView(byId[route]);
  navEl.dataset.v = route === 'home' ? 'home' : byId[route] ? 'pdp' : '';
  document.title = route === 'home' ? 'Susurrus' : route === 'stories' ? 'Stories · Susurrus' : route === 'studio' ? 'Studio · Susurrus' : `S.${byId[route].n} ${byId[route].name} · Susurrus`;
  bindView();
  if (route === 'naples') storyIntro('Naples');
}

/* same choreography as the home intro: a thin bar rises at the centre, the letters open out of it one by one, then the paper dissolves */
function storyIntro(title){
  if (reduce.matches) return;
  document.querySelectorAll('.sintro').forEach(n => n.remove());
  const root = document.documentElement;
  root.classList.add('intro-on');
  const box = document.createElement('div');
  box.className = 'sintro'; box.setAttribute('aria-hidden', 'true');
  const L = [...title.toUpperCase()], cut = Math.ceil(L.length / 2);
  const left = L.slice(0, cut), right = L.slice(cut);
  const letter = (ch, side, k) => `<span class="tl"><i style="--from:${side === 'l' ? '' : '-'}115%;--d:${400 + k * 150}ms">${ch}</i></span>`;
  box.innerHTML = `<h2><span class="sl">${left.map((c, i) => letter(c, 'l', left.length - 1 - i)).join('')}</span><span class="sr">${right.map((c, i) => letter(c, 'r', i)).join('')}</span></h2>`;
  document.body.appendChild(box);
  requestAnimationFrame(() => requestAnimationFrame(() => box.classList.add('t-in')));
  let done = false;
  const exit = () => {
    if (done) return; done = true;
    root.classList.remove('intro-on');
    box.animate([{opacity:1}, {opacity:0}], {duration:1300, easing:'cubic-bezier(.4,0,.2,1)', fill:'forwards'}).finished.then(() => box.remove());
  };
  const t = setTimeout(exit, 2900);
  box.addEventListener('click', () => { clearTimeout(t); exit(); });
}

let entering = true;
function go(route, {seamless = false, push = true, fromEl = null} = {}){
  if (lock) return;
  entering = !seamless;
  const target = route;
  const apply = () => {
    render(target);
    toTop();
    if (push) history.pushState(null, '', `#${target}`);
  };
  lock = true; setTimeout(() => lock = false, seamless ? 600 : 900);
  if (seamless || target === 'naples' || !document.startViewTransition || matchMedia('(prefers-reduced-motion: reduce)').matches) { apply(); return; }
  if (fromEl) fromEl.style.viewTransitionName = 'story-img';
  document.startViewTransition(apply);
}

document.addEventListener('click', e => {
  const a = e.target.closest('[data-go]');
  if (a) { e.preventDefault(); go(a.dataset.go); return; }
  const o = e.target.closest('[data-open]');
  if (o) { go(o.dataset.open, {fromEl: o.querySelector('img')}); return; }
  const P = e.target.closest('[data-pick]');
  if (P) {
    FS.pick = FS.pick === P.dataset.pick ? null : P.dataset.pick;
    syncFilters(); highlight(null);
    if (FS.pick) view.querySelectorAll('.loop').forEach(l => l._goTo && l._goTo(FS.pick));
    return;
  }
});
window.addEventListener('popstate', () => { render(routeFrom(location.hash)); toTop(); });

let imgIO = null;
function revealImages(){
  if (imgIO) imgIO.disconnect();
  const show = img => requestAnimationFrame(() => img.classList.add('in'));
  imgIO = new IntersectionObserver(entries => entries.forEach(e => {
    if (!e.isIntersecting) return;
    const img = e.target; imgIO.unobserve(img);
    if (img.complete && img.naturalWidth) show(img);
    else { img.addEventListener('load', () => show(img), {once: true}); img.addEventListener('error', () => show(img), {once: true}); }
  }), {rootMargin: '0px 0px -4% 0px'});
  // the seamless Home → Stories swap must not flash: those images are already on screen
  if (view.classList.contains('instant')) {
    view.querySelectorAll('img').forEach(img => img.classList.add('in'));
    requestAnimationFrame(() => requestAnimationFrame(() => view.classList.remove('instant')));
    return;
  }
  view.querySelectorAll('img').forEach(img => imgIO.observe(img));
}

function bindView(){
  quoteEls = [...view.querySelectorAll('[data-quote]')].map(el => ({el, words:[...el.querySelectorAll('.w')], lit:+(el.dataset.lit || .45)}));
  sketches = [...view.querySelectorAll('.sk')];
  teaser = document.getElementById('teaser');
  tail = document.getElementById('tail');
  bar = document.getElementById('nextbar');
  const grids = [...view.querySelectorAll('.grid')];
  if (grids.length) {
    highlight(null);
    view.querySelectorAll('.cell,[data-pick]').forEach(el => {
      const id = () => el.dataset.g || el.dataset.pick;
      el.addEventListener('pointerenter', () => { const v = id(); if (v) highlight(v); });
      el.addEventListener('pointerleave', () => highlight(null));
      el.addEventListener('focusin', () => { const v = id(); if (v) highlight(v); });
      el.addEventListener('focusout', () => highlight(null));
    });
  }
  view.querySelectorAll('.loop').forEach(l => initLoop(l, !!l.closest('#plp')));
  view.querySelectorAll('[data-copy] button').forEach(el => el.tabIndex = -1);
  revealImages();
  splitTitles();
  revealBlocks();
  lastY = window.scrollY;
  onScroll();
}

/* ---------- body text by lines, images by mask ---------- */
const LINE_SEL = '.sh .eyebrow,.sh .lead,.duo figcaption,.marco .cap,.loose-t,.reveal .txt,.reveal .eyebrow,.split h3,.split p,.bio p,.studio-intro .lead-lg,.studio-intro .eyebrow,.caps2 p,.cap1,.statement,.fig figcaption,.foot .tag,.member figcaption';
const IMG_SEL = '.ph,.marco .frame,.split .inner img,.board img,.hero';
let blockIO = null;
const introDone = fn => { const t = () => document.documentElement.classList.contains('intro-on') ? setTimeout(t, 120) : fn(); t(); };
function lineify(el){
  if (el.dataset.ln) return;
  el.dataset.ln = 1;
  // wrap loose words so every word is a measurable box
  const walk = n => [...n.childNodes].forEach(c => {
    if (c.nodeType === 3) {
      if (!c.textContent.trim()) return;
      const frag = document.createDocumentFragment();
      c.textContent.split(/(\s+)/).forEach(w => { if (!w) return; if (/^\s+$/.test(w)) frag.append(' '); else { const sp = document.createElement('span'); sp.className = 'lw'; sp.textContent = w; frag.append(sp); } });
      c.replaceWith(frag);
    } else if (c.nodeType === 1 && !c.classList.contains('w') && c.tagName !== 'BR') walk(c);
  });
  walk(el);
  const words = [...el.querySelectorAll('.lw,.w')].filter(w => !w.parentElement.closest('.w'));
  if (!words.length) return;
  const lines = [];
  let top = null;
  words.forEach(w => { const t = Math.round(w.offsetTop); if (top === null || Math.abs(t - top) > 2) { lines.push([]); top = t; } lines[lines.length - 1].push(w.outerHTML); });
  el.innerHTML = lines.map((l, i) => `<span class="ln"><span class="li" style="--d:${i * 110}ms">${l.join(' ')}</span></span>`).join('');
}
function revealBlocks(){
  if (blockIO) blockIO.disconnect();
  if (reduce.matches) return;
  const scope = el => !el.closest('.plp,.intro');
  const texts = [...view.querySelectorAll(LINE_SEL)].filter(scope);
  const imgs = [...view.querySelectorAll(IMG_SEL)].filter(scope);
  blockIO = new IntersectionObserver(es => es.forEach(e => {
    if (!e.isIntersecting) return;
    const el = e.target; blockIO.unobserve(el);
    introDone(() => el.classList.add(el.dataset.ln ? 'lines-in' : 'rv-in'));
  }), {rootMargin:'0px 0px 0px 0px'});
  imgs.forEach(el => { el.classList.add('rv'); blockIO.observe(el); });
  (document.fonts ? document.fonts.ready : Promise.resolve()).then(() => {
    texts.forEach(el => { if (el.isConnected) { lineify(el); blockIO.observe(el); } });
    // word-by-word reveals point at the rebuilt spans
    quoteEls = [...view.querySelectorAll('[data-quote]')].map(el => ({el, words:[...el.querySelectorAll('.w')], lit:+(el.dataset.lit || .45)}));
    onScroll();
  });
}

/* ---------- section titles reveal ---------- */
let titleIO = null;
function splitTitles(){
  if (titleIO) titleIO.disconnect();
  const hs = [...view.querySelectorAll('.sh h2')];
  if (reduce.matches || !hs.length) return;
  hs.forEach(h => {
    if (h.dataset.split) return;
    h.dataset.split = 1;
    h.setAttribute('aria-label', h.textContent.replace(/\s+/g, ' ').trim());
    // collect letters across text nodes, keeping <br>
    const parts = [];
    h.childNodes.forEach(n => { if (n.nodeType === 3) parts.push(n.textContent); else if (n.nodeName === 'BR') parts.push('\n'); });
    const letters = parts.join('').replace(/\n/g, '').replace(/\s/g, '').length, mid = (letters - 1) / 2;
    let k = 0;
    h.innerHTML = '<span aria-hidden="true">' + parts.map(t => t === '\n' ? '<br>' : t.split(/(\s+)/).map(w => /^\s+$/.test(w) || !w ? w : `<span class="tw">${[...w].map(ch => {
      const i = k++, left = i < mid;
      return `<span class="tl"><i style="--from:${left ? '' : '-'}110%;--d:${Math.round(Math.abs(i - mid) * 75)}ms">${ch}</i></span>`;
    }).join('')}</span>`).join('')).join('') + '</span>';
  });
  titleIO = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('t-in'); titleIO.unobserve(e.target); } }), {rootMargin:'0px 0px -12% 0px'});
  hs.forEach(h => titleIO.observe(h));
}

/* ---------- infinite stories wheel ---------- */
let loopRAF = 0;
function initLoop(loop, interactive){
  const track = loop.querySelector('.track'), copy = track.children[1];
  let H = 0, start = 0, cur = 0, target = 0;
  const measure = () => {
    const gap = parseFloat(getComputedStyle(track).rowGap) || 0;
    H = copy.offsetHeight + gap;
    start = (parseFloat(getComputedStyle(loop).getPropertyValue('--ft')) || 0) + 16;   // first row sits just below the top fade
  };
  const paint = () => {
    const m = ((cur % H) + H) % H;
    track.style.transform = `translate3d(0,${(start - H - m).toFixed(2)}px,0)`;
  };
  measure(); paint();
  const ro = new ResizeObserver(() => { measure(); paint(); }); ro.observe(loop); ro.observe(copy);
  /* bring a story's first image to the top of the wheel by the shortest way round */
  loop._goTo = id => {
    const cell = copy.querySelector(`.cell[data-story="${id}"]`);
    if (!cell || !H) return;
    const want = cell.offsetTop, m = ((cur % H) + H) % H;
    let d = want - m; if (d > H / 2) d -= H; if (d < -H / 2) d += H;
    target = cur + d;
    if (!interactive) { cur = target; paint(); }
  };
  loop._home = () => { if (H) target = Math.round(cur / H) * H; cur = target; paint(); };
  if (!interactive) return;
  cancelAnimationFrame(loopRAF);
  const tick = () => {
    if (!loop.isConnected) return;
    const d = target - cur;
    cur = Math.abs(d) < .05 ? target : cur + d * .1;
    paint();
    loopRAF = requestAnimationFrame(tick);
  };
  loopRAF = requestAnimationFrame(tick);
  const host = loop.closest('.plp');
  host.addEventListener('wheel', e => {
    e.preventDefault();
    const k = e.deltaMode === 1 ? 32 : e.deltaMode === 2 ? innerHeight : 1;
    target += e.deltaY * k;
  }, {passive: false});
  let ty = null, lastT = 0, v = 0;
  loop.addEventListener('pointerdown', e => { if (e.pointerType === 'mouse') return; ty = e.clientY; lastT = performance.now(); v = 0; });
  addEventListener('pointermove', e => {
    if (ty === null || !loop.isConnected) return;
    const dy = ty - e.clientY, now = performance.now();
    v = dy / Math.max(1, now - lastT); lastT = now; ty = e.clientY;
    target += dy; cur = target;
  });
  addEventListener('pointerup', () => { if (ty === null) return; ty = null; target += v * 320; });
  addEventListener('pointercancel', () => { ty = null; });
  host.tabIndex = -1;
  host.addEventListener('keydown', e => {
    const step = {ArrowDown: 120, ArrowUp: -120, PageDown: loop.clientHeight * .8, PageUp: -loop.clientHeight * .8, ' ': loop.clientHeight * .8}[e.key];
    if (step) { e.preventDefault(); target += step; }
  });
}

const veil = document.querySelector('.texveil');
const navEl = document.querySelector('.nav');
let navAcc = 0;
const LIGHT_IMG = /sketch|ornament|dd_frame|p_drawing|p_stucco|p_villa|sk_|n_marco|n_board/;
function navTone(){
  navEl.querySelectorAll('.logo,.menu,.mbar').forEach(el => {
    if (!el.offsetWidth) return;
    // sample at the item's resting place, so the colour is already right when a hidden header slides back
    let onImg = false;
    for (const e of document.elementsFromPoint(el.offsetLeft + el.offsetWidth / 2, el.offsetTop + el.offsetHeight / 2)) {
      if (e.closest('.nav,.intro,.mnav,.texveil')) continue;
      if (e.tagName === 'IMG') { onImg = !LIGHT_IMG.test(e.getAttribute('src') || ''); break; }
      if (e.closest('.foot')) { onImg = true; break; }
      const bg = getComputedStyle(e).backgroundColor;
      if (bg && bg !== 'transparent' && !/rgba\(.*,\s*0\)$/.test(bg)) break;
    }
    el.classList.toggle('on-img', onImg);
  });
}
function onScroll(){
  const y = window.scrollY, vh = innerHeight, down = y > lastY;
  /* header: hides while scrolling down, returns on the way up (and always at the very top) */
  navAcc = (down === navAcc > 0 ? navAcc : 0) + (y - lastY);
  if (y < 80) navEl.classList.remove('away');
  else if (navAcc > 24) navEl.classList.add('away');
  else if (navAcc < -24) navEl.classList.remove('away');
  navTone();
  const atEnd = y > 0 && y + vh >= document.documentElement.scrollHeight - 4;
  lastY = y;
  quoteEls.forEach(({el, words, lit}) => {
    const r = el.getBoundingClientRect();
    const p = Math.min(1, Math.max(0, (vh * .8 - r.top) / (r.height * .9)));
    const n = Math.round(p * words.length);
    words.forEach((w, i) => w.classList.toggle('dim', i >= Math.max(n, Math.round(words.length * lit))));
  });
  if (!reduce.matches) sketches.forEach(sk => {
    const r = sk.parentElement.getBoundingClientRect();
    const d = (r.top + r.height / 2 - vh / 2) * +sk.dataset.par;
    sk.style.transform = `translateY(${d.toFixed(1)}px) rotate(${(d * .004).toFixed(2)}deg)`;
  });
  if (bar && teaser) {
    const t = teaser.getBoundingClientRect().top;
    bar.style.transform = `scaleX(${Math.min(1, Math.max(0, 1 - t / vh))})`;
  }
  /* End of Home: the tail is a pixel copy of the Stories page's first screen; once it fills the viewport we swap to it. */
  if (tail) {
    const pr = Math.min(1, Math.max(0, 1 - tail.getBoundingClientRect().top / vh));
    tail.style.setProperty('--p', pr.toFixed(3));
    veil.style.opacity = (pr * pr * (3 - 2 * pr)).toFixed(3);
  } else veil.style.opacity = 0;
  if (tail && down && (tail.getBoundingClientRect().top <= 2 || atEnd)) go('stories', {seamless: true});
  /* End of a story: the teaser is the next story's opening screen. */
  if (teaser && down && (teaser.getBoundingClientRect().top <= 2 || atEnd)) {
    const next = STORIES[(STORIES.indexOf(byId[current]) + 1) % STORIES.length];
    go(next.id);
  }
}
let ticking = false;
window.addEventListener('scroll', () => { if (!ticking) { ticking = true; requestAnimationFrame(() => { onScroll(); ticking = false; }); } }, {passive: true});
window.addEventListener('resize', onScroll);

/* ---------- ambient sound: a soft filtered-noise "susurrus" ---------- */
const sws = [...document.querySelectorAll('.sw')];
const sw = { getAttribute: k => sws[0].getAttribute(k), setAttribute: (k, v) => sws.forEach(b => b.setAttribute(k, v)) };
let ctx = null, master = null;
const toggleSound = async () => {
  const on = sw.getAttribute('aria-pressed') !== 'true';
  sw.setAttribute('aria-pressed', on);
  try {
    if (!ctx) {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      const len = ctx.sampleRate * 4, buf = ctx.createBuffer(2, len, ctx.sampleRate);
      for (let ch = 0; ch < 2; ch++) { const d = buf.getChannelData(ch); let last = 0; for (let i = 0; i < len; i++) { const w = Math.random() * 2 - 1; last = (last + .02 * w) / 1.02; d[i] = last * 3.2; } }
      const src = ctx.createBufferSource(); src.buffer = buf; src.loop = true;
      const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 900; bp.Q.value = .6;
      const lfo = ctx.createOscillator(), lfoGain = ctx.createGain(); lfo.frequency.value = .07; lfoGain.gain.value = 500; lfo.connect(lfoGain).connect(bp.frequency);
      const swell = ctx.createGain(); swell.gain.value = .6;
      const lfo2 = ctx.createOscillator(), lfo2g = ctx.createGain(); lfo2.frequency.value = .11; lfo2g.gain.value = .35; lfo2.connect(lfo2g).connect(swell.gain);
      master = ctx.createGain(); master.gain.value = 0;
      src.connect(bp).connect(swell).connect(master).connect(ctx.destination);
      src.start(); lfo.start(); lfo2.start();
    }
    if (ctx.state === 'suspended') await ctx.resume();
    master.gain.setTargetAtTime(on ? .5 : 0, ctx.currentTime, .6);
  } catch (err) { sw.setAttribute('aria-pressed', 'false'); }
};
sws.forEach(b => b.addEventListener('click', toggleSound));

/* ---------- mobile menu ---------- */
const mnav = document.getElementById('mnav'), mbtn = document.querySelector('.menu-btn');
const setMenu = open => { mnav.hidden = !open; mbtn.setAttribute('aria-expanded', open); document.documentElement.style.overflow = open ? 'hidden' : ''; };
mbtn.addEventListener('click', () => setMenu(true));
mnav.querySelector('.mnav-close').addEventListener('click', () => setMenu(false));
mnav.addEventListener('click', e => { if (e.target.closest('[data-go]')) setMenu(false); });
addEventListener('keydown', e => { if (e.key === 'Escape' && !mnav.hidden) setMenu(false); });

render(routeFrom(location.hash));

/* ---------- wordmark unfold: the thin bar first, then the letters open out of it ---------- */
const EASE = 'cubic-bezier(.65,0,.25,1)';
/* Split the wordmark once: every letter sits in its own clipping box. On reveal each letter slides into its box from the bar's side,
   one after another, moving outward from the bar. */
let wmId = 0;
function wordmarkParts(svg){
  if (svg._wm) return svg._wm;
  const NS = 'http://www.w3.org/2000/svg';
  const paths = [...svg.querySelectorAll('path')], bb = paths.map(p => p.getBBox());
  const bi = bb.reduce((m, b, i) => b.width < bb[m].width ? i : m, 0), bar = bb[bi];
  const vb = svg.viewBox.baseVal, cx = bar.x + bar.width / 2, id = 'wm' + (++wmId);
  const defs = document.createElementNS(NS, 'defs'); svg.insertBefore(defs, svg.firstChild);
  const letters = paths.map((p, i) => i).filter(i => i !== bi).map(i => {
    const b = bb[i], cp = document.createElementNS(NS, 'clipPath'), r = document.createElementNS(NS, 'rect');
    cp.id = `${id}-${i}`;
    r.setAttribute('x', b.x - .2); r.setAttribute('y', -4); r.setAttribute('width', b.width + .4); r.setAttribute('height', vb.height + 8);
    cp.appendChild(r); defs.appendChild(cp);
    const outer = document.createElementNS(NS, 'g'), inner = document.createElementNS(NS, 'g');
    outer.setAttribute('clip-path', `url(#${cp.id})`); outer.appendChild(inner); svg.insertBefore(outer, paths[i]); inner.appendChild(paths[i]);
    const left = b.x + b.width / 2 < cx;
    return {el:inner, from:(left ? 1 : -1) * (b.width * 1.1 + 2), dist:Math.abs(b.x + b.width / 2 - cx), left};
  });
  // reveal order: per side, nearest to the bar first
  const order = side => letters.filter(l => l.left === side).sort((x, y) => x.dist - y.dist);
  order(true).forEach((l, k) => l.k = k); order(false).forEach((l, k) => l.k = k);
  return svg._wm = {bar:paths[bi], letters, pc:(cx - vb.x) / vb.width * 100};
}
function unfold(svg, {delay = 0, duration = 950, step = 140} = {}){
  return wordmarkParts(svg).letters.map(l => l.el.animate(
    [{transform:`translateX(${l.from}px)`}, {transform:'translateX(0)'}],
    {duration, delay:delay + l.k * step, easing:'cubic-bezier(.6,0,.2,1)', fill:'both'}));
}
function fold(svg, {duration = 700, step = 110} = {}){
  const L = wordmarkParts(svg).letters, max = Math.max(...L.map(l => l.k));
  return L.map(l => l.el.animate(
    [{transform:'translateX(0)'}, {transform:`translateX(${l.from}px)`}],
    {duration, delay:(max - l.k) * step, easing:'cubic-bezier(.6,0,.4,1)', fill:'both'}));
}

/* header logo: on hover it folds into the bar and opens again */
(function headerHover(){
  const link = document.querySelector('.nav .logo'), svg = link.querySelector('svg');
  if (!svg.animate) return;
  let running = null;
  link.addEventListener('pointerenter', async () => {
    if (running || reduce.matches || document.documentElement.classList.contains('intro-on')) return;
    running = fold(svg);
    try { await Promise.all(running.map(a => a.finished)); } catch (e) {}
    running.forEach(a => a.cancel());
    running = unfold(svg, {delay:300, duration:1100, step:170});
    try { await Promise.all(running.map(a => a.finished)); } catch (e) {}
    running.forEach(a => a.cancel());
    running = null;
  });
})();

/* ---------- intro (first load of Home only) ---------- */
(function intro(){
  const box = document.getElementById('intro');
  if (current !== 'home' || reduce.matches || !box.animate) { box.remove(); return; }
  const root = document.documentElement;
  root.classList.add('intro-on');
  const holder = box.querySelector('.intro-logo');
  holder.innerHTML = LOGO;
  const svg = holder.querySelector('svg'), w = wordmarkParts(svg);
  const anims = [];
  // 1. the bar, alone at the centre of the screen
  anims.push(svg.animate([{transform:`translateX(${(50 - w.pc).toFixed(2)}%)`}, {transform:`translateX(${(50 - w.pc).toFixed(2)}%)`, offset:.45}, {transform:'translateX(0)'}], {duration:2400, easing:EASE, fill:'both'}));
  anims.push(w.bar.animate([{transform:'scaleY(0)', transformOrigin:'50% 50%'}, {transform:'scaleY(1)', transformOrigin:'50% 50%'}], {duration:800, delay:200, easing:'cubic-bezier(.33,0,.15,1)', fill:'both'}));
  // 2. the wordmark opens out of it
  anims.push(...unfold(svg, {delay:1150, duration:1000, step:150}));
  // 3. paper and wordmark dissolve together into the photograph; the header arrives afterwards
  let done = false;
  const exit = () => {
    if (done) return; done = true;
    anims.forEach(a => a.finish());
    root.classList.remove('intro-on');
    document.querySelector('.nav').animate([{opacity:0}, {opacity:0, offset:.55}, {opacity:1}], {duration:2200, easing:'ease', fill:'backwards'});
    box.animate([{opacity:1}, {opacity:0}], {duration:1300, easing:'cubic-bezier(.4,0,.2,1)', fill:'forwards'}).finished.then(() => box.remove());
  };
  const t = setTimeout(exit, 3400);
  const skip = () => { clearTimeout(t); exit(); };
  box.addEventListener('click', skip);
  addEventListener('keydown', skip, {once:true});
  // ignore trackpad momentum left over from before the page loaded
  setTimeout(() => addEventListener('wheel', skip, {once:true, passive:true}), 1200);
})();
})();
</script>
